<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxia de Amor - Thenara</title>
    <style>
        :root {
            --letter-love: 200px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
        }

        /* ------------------ FIRST PAGE ------------------ */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            -webkit-transform: translate3d(-50%, -50%, 0);
            transform: translate3d(-50%, -50%, 0);
            text-align: center;
            z-index: 10;
            width: 95%;
            max-width: 500px;
            transition: opacity 1s ease;
        }

        .Flores_Amarillas {
            font-size: 2.2rem;
            font-family: 'Georgia', serif;
            color: #ffe600;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.7);
            white-space: nowrap;
            margin-bottom: 30px;
            text-align: center;
        }

        .go-btn {
            background: rgba(5, 5, 5, 0.9);
            border: 2px solid #ffe600;
            color: #ffe600;
            padding: 10px 30px;
            font-size: 1.5rem;
            font-family: 'Georgia', cursive, serif;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            display: inline-block;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4), inset 0 0 10px rgba(255, 230, 0, 0.3);
            -webkit-animation: floatButtonMobile 2.5s ease-in-out infinite, pulseGlow 2s infinite ease-in-out;
            animation: floatButtonMobile 2.5s ease-in-out infinite, pulseGlow 2s infinite ease-in-out;
            will-change: transform, box-shadow;
        }

        @-webkit-keyframes floatButtonMobile {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -9px, 0); }
        }
        @keyframes floatButtonMobile {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -9px, 0); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px #ffe600, inset 0 0 6px #ffe600; }
            50% { box-shadow: 0 0 20px #ffe600, 0 0 8px #ffffff, inset 0 0 12px #ffe600; }
        }

        .btn-star {
            position: absolute;
            color: #ffe600;
            font-size: 10px;
            pointer-events: none;
            opacity: 0.8;
            animation: innerStarMove 2s ease-in-out infinite alternate;
        }

        @keyframes innerStarMove {
            0% { transform: translate3d(0, 0, 0) scale(0.8); opacity: 0.3; }
            100% { transform: translate3d(4px, -5px, 0) scale(1.2); opacity: 0.9; }
        }

        /* 1st Page Yellow Particles */
        .flower {
            position: absolute;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffd700, 0 0 15px #ffae00;
            animation: floatUp linear infinite;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes floatUp {
            0% { transform: translate3d(0, 100vh, 0) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translate3d(0, -10vh, 0) scale(1.2); opacity: 0; }
        }

        .yellow-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffe600;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 1s ease-in-out;
        }

        /* ------------------ SECOND PAGE ------------------ */
        .next-page {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            transition: opacity 2s ease;
            overflow: hidden;
        }

        .next-page h1 {
            color: #ffe600;
            font-size: 2rem;
            text-shadow: 0 0 15px #ffe600;
            font-family: 'Georgia', serif;
            text-align: center;
            margin: 0 15px;
            line-height: 1.4;
            z-index: 205;
            pointer-events: none;
        }

        #thenaraCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 201;
        }
    </style>
</head>
<body>

    <div class="yellow-overlay" id="overlay"></div>

    <!-- FIRST PAGE CONTAINER -->
    <div class="container" id="mainContainer">
        <div class="Flores_Amarillas">
            💛 Happy birthday Thenara 💛
        </div>
        
        <button class="go-btn" id="goButton" onclick="startTransition()">
            <span class="btn-star" style="top: 3px; left: 5px; animation-delay: 0s;">✦</span>
            <span class="btn-star" style="bottom: 3px; left: 10px; animation-delay: 0.5s;">◆</span>
            <span class="btn-star" style="top: 4px; right: 6px; animation-delay: 1s;">✦</span>
            <span class="btn-star" style="bottom: 3px; right: 10px; animation-delay: 1.5s;">★</span>
            go
        </button>
    </div>

    <!-- SECOND PAGE CONTAINER -->
    <div class="next-page" id="nextPage">
        <canvas id="thenaraCanvas"></canvas>
        <h1>✨ May all your dreams come true! ✨</h1>
    </div>

    <script>
        // ---------------- FIRST PAGE LOGIC ----------------
        let spawnInterval = setInterval(createFlower, 180);

        function createFlower(isExplosion = false) {
            const flower = document.createElement('div');
            flower.classList.add('flower');

            const sizeNum = isExplosion ? Math.random() * 20 + 8 : Math.random() * 6 + 4;
            flower.style.width = sizeNum + 'px';
            flower.style.height = sizeNum + 'px';
            flower.style.left = Math.random() * 100 + 'vw';

            const duration = isExplosion ? (Math.random() * 1.5 + 1) : (Math.random() * 3 + 3);
            flower.style.animationDuration = duration + 's';

            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }

        function startTransition() {
            clearInterval(spawnInterval);
            let explosionInterval = setInterval(() => {
                createFlower(true);
            }, 25);

            document.getElementById('mainContainer').style.opacity = '0';

            setTimeout(() => {
                document.getElementById('overlay').style.opacity = '1';
            }, 800);

            setTimeout(() => {
                clearInterval(explosionInterval);
                document.getElementById('nextPage').style.opacity = '1';
                document.getElementById('nextPage').style.pointerEvents = 'auto';
                initThenaraCanvas(); // 2nd page canvas initiation
            }, 2000);
        }

        // ---------------- SECOND PAGE LOGIC (THENARA ADVANCED ANIMATION) ----------------
        function initThenaraCanvas() {
            const canvas = document.getElementById('thenaraCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const particles = [];
            const particleCount = 40; // මුළු Screen එක පුරාම පාවෙන කුඩා THENARA ගණන

            let targetX = canvas.width / 2;
            let targetY = canvas.height / 2;
            let isHolding = false;

            class ThenaraParticle {
                constructor() {
                    this.size = Math.random() * 4 + 9; // ඉතා කුඩා, සංවේදී Font size (9px - 13px)
                    this.textWidth = this.size * 5; 
                    this.resetInitial();
                    this.opacity = Math.random() * 0.5 + 0.4;
                }

                resetInitial() {
                    this.x = Math.random() * (canvas.width - 60);
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.6; // හතරවටේටම පාවීමට
                    this.vy = (Math.random() - 0.5) * 0.6;
                }

                update() {
                    if (isHolding) {
                        // ඔබාගෙන සිටින විට ඉතා හිමීට (Smooth) ඇඟිල්ල තැබූ තැනටම ළඟා වීම
                        const dx = targetX - this.x;
                        const dy = targetY - this.y;
                        this.x += dx * 0.035; // හිමීට ඇදී ඒමේ වේගය
                        this.y += dy * 0.035;
                    } else {
                        // අත්හළ පසු හතරවටේටම හිමීට පාවීම
                        this.x += this.vx;
                        this.y += this.vy;

                        // Screen එකෙන් පිටට යාම වැළැක්වීම
                        if (this.x < 0 || this.x > canvas.width - 50) this.vx *= -1;
                        if (this.y < 20 || this.y > canvas.height) this.vy *= -1;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.font = `600 ${this.size}px Georgia, serif`;
                    ctx.fillStyle = '#ffe600';
                    ctx.globalAlpha = this.opacity;
                    ctx.shadowColor = '#ffe600';
                    ctx.shadowBlur = 6;
                    ctx.fillText('THENARA', this.x, this.y);
                    ctx.restore();
                }
            }

            // එකිනෙක ගෑවෙන්නේ නැති ලෙස පාවෙන Particles නිර්මාණය කිරීම
            for (let i = 0; i < particleCount; i++) {
                particles.push(new ThenaraParticle());
            }

            // Touch / Press Event Handlers
            function startHold(e) {
                isHolding = true;
                updateTarget(e);
            }

            function moveHold(e) {
                if (isHolding) {
                    updateTarget(e);
                }
            }

            function endHold() {
                isHolding = false; // ඇඟිල්ල ඉවතට ගත් විට ආපසු ඈතට හිමීට පාවීම
            }

            function updateTarget(e) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                targetX = clientX;
                targetY = clientY;
            }

            window.addEventListener('mousedown', startHold);
            window.addEventListener('mousemove', moveHold);
            window.addEventListener('mouseup', endHold);

            window.addEventListener('touchstart', startHold);
            window.addEventListener('touchmove', moveHold);
            window.addEventListener('touchend', endHold);

            // Animation Loop
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // එකිනෙක ගෑවීම වැළැක්වීමේ collision prevention logic
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const p1 = particles[i];
                        const p2 = particles[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 35 && !isHolding) {
                            p1.x += dx * 0.02;
                            p1.y += dy * 0.02;
                            p2.x -= dx * 0.02;
                            p2.y -= dy * 0.02;
                        }
                    }
                }

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>

</body>
</html>
