<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOI-SYN | Exact ASCII Face Tracking</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #030508;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 900px;
        }

        /* Responsive Box for Mobile View */
        .ascii-wrapper {
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            background: #000;
            border: 1px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            border-radius: 6px;
            padding: 5px;
        }

        #asciiOutput {
            font-size: 2.2px; /* Mobile එකට ගැලපෙන ලෙස කුඩා කර ඇත */
            line-height: 2.2px;
            letter-spacing: 0px;
            white-space: pre;
            transition: transform 0.05s ease-out;
            user-select: none;
            display: inline-block;
        }

        /* Desktop සහ ටැබ්ලට් සඳහා Font Size එක විශාල කිරීම */
        @media (min-width: 600px) {
            #asciiOutput {
                font-size: 4px;
                line-height: 4px;
            }
        }

        .controls {
            display: flex;
            gap: 8px;
            width: 100%;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 180px;
            padding: 10px;
            border: 1px solid #00ff66;
            background: #051008;
            color: #00ff66;
            border-radius: 4px;
            font-size: 12px;
        }

        button {
            padding: 10px 15px;
            background: #00ff66;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

        #hiddenVideo { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="ascii-wrapper">
            <pre id="asciiOutput"></pre>
        </div>

        <div class="controls">
            <input type="password" id="geminiKey" placeholder="Enter Google Gemini API Key">
            <button onclick="startSystem()">ACTIVATE CAMERA & TRACKING</button>
        </div>

        <div class="controls">
            <input type="text" id="userInput" placeholder="Talk to VOI-SYN..." onkeypress="handleKey(event)">
            <button onclick="speakAI()">SEND</button>
        </div>
    </div>

    <video id="hiddenVideo" autoplay playsinline></video>

        const asciiBox = document.getElementById('asciiOutput');
        let mouthMovableLines = [60, 61, 62, 63];

        asciiBox.innerText = originalAscii.join('\n');

        function startSystem() {
            const video = document.getElementById('hiddenVideo');
            
            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
            
            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    const nose = results.multiFaceLandmarks[0][1];
                    let moveX = (nose.x - 0.5) * 30; 
                    let moveY = (nose.y - 0.5) * 20;
                    asciiBox.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            });

            const camera = new Camera(video, {
                onFrame: async () => { await faceMesh.send({ image: video }); },
                width: 320, height: 240
            });
            camera.start();
        }

        async function speakAI() {
            const input = document.getElementById('userInput').value;
            const key = document.getElementById('geminiKey').value;
            if(!input || !key) return alert("Enter Key and Message!");

            document.getElementById('userInput').value = "";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "You are VOI-SYN AI. Short answer: " + input }] }] })
                });
                
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;

                const utterance = new SpeechSynthesisUtterance(reply);
                
                utterance.onboundary = () => {
                    let tempAscii = [...originalAscii];
                    mouthMovableLines.forEach(idx => {
                        tempAscii[idx] = tempAscii[idx].replace(/2s2/g, "   ").replace(/522/g, "   ");
                    });
                    asciiBox.innerText = tempAscii.join('\n');
                };

                utterance.onend = () => {
                    asciiBox.innerText = originalAscii.join('\n');
                };

                window.speechSynthesis.speak(utterance);

            } catch (e) {
                alert("API Error!");
            }
        }

        function handleKey(e) { if(e.key === 'Enter') speakAI(); }
    </script>
</body>
</html>
