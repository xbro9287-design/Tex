<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
      maximum-scale=1,user-scalable=no">

<title>Touch Glowing Heart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
}

body{
    position:fixed;
    inset:0;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W,H,DPR;

function resize(){

    DPR=Math.min(devicePixelRatio||1,2);

    W=innerWidth;
    H=innerHeight;

    canvas.width=W*DPR;
    canvas.height=H*DPR;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

resize();
addEventListener("resize",resize);


/* =========================
   HEART
========================= */

function heart(t){

    return {
        x:16*Math.pow(Math.sin(t),3),
        y:-(13*Math.cos(t)
          -5*Math.cos(2*t)
          -2*Math.cos(3*t)
          -Math.cos(4*t))
    };
}


/* =========================
   HEART POSITION
========================= */

let heartX=W/2;
let heartY=H/2;

let targetX=heartX;
let targetY=heartY;

let velocityX=0;
let velocityY=0;

let dragging=false;

let lastX=0;
let lastY=0;


/* =========================
   TOUCH / MOUSE
========================= */

function pointerDown(x,y){

    dragging=true;

    lastX=x;
    lastY=y;

    targetX=x;
    targetY=y;
}

function pointerMove(x,y){

    if(!dragging) return;

    const dx=x-lastX;
    const dy=y-lastY;

    velocityX=dx;
    velocityY=dy;

    targetX=x;
    targetY=y;

    lastX=x;
    lastY=y;
}

function pointerUp(){

    dragging=false;
}


canvas.addEventListener("pointerdown",e=>{
    pointerDown(e.clientX,e.clientY);
});

canvas.addEventListener("pointermove",e=>{
    pointerMove(e.clientX,e.clientY);
});

canvas.addEventListener("pointerup",pointerUp);
canvas.addEventListener("pointercancel",pointerUp);
canvas.addEventListener("pointerleave",pointerUp);


/* =========================
   PARTICLES
========================= */

const particles=[];

for(let i=0;i<1100;i++){

    const t=Math.random()*Math.PI*2;
    const h=heart(t);

    particles.push({

        t:t,

        x:heartX+h.x*10,
        y:heartY+h.y*10,

        oldX:heartX,
        oldY:heartY,

        speed:
            .00025+
            Math.random()*.0008,

        size:
            .3+
            Math.random()*1.8,

        alpha:
            .25+
            Math.random()*.75,

        phase:
            Math.random()*Math.PI*2,

        wobble:
            Math.random()*2-1
    });
}


/* =========================
   TRAIL PARTICLES
========================= */

const trails=[];

function makeTrail(){

    if(
        Math.abs(velocityX)+
        Math.abs(velocityY)<1
    ) return;

    for(let i=0;i<5;i++){

        trails.push({

            x:heartX+(Math.random()-.5)*35,
            y:heartY+(Math.random()-.5)*35,

            vx:
                -velocityX*.35+
                (Math.random()-.5)*2,

            vy:
                -velocityY*.35+
                (Math.random()-.5)*2,

            life:1,

            size:
                Math.random()*3+1
        });
    }
}


/* =========================
   DRAW
========================= */

function draw(){

    requestAnimationFrame(draw);

    const now=performance.now();

    /*
      Smooth movement
    */

    heartX += (targetX-heartX)*.13;
    heartY += (targetY-heartY)*.13;

    velocityX*=.92;
    velocityY*=.92;

    makeTrail();


    /*
      Black fading background
      gives motion trails
    */

    ctx.fillStyle="rgba(0,0,0,.20)";
    ctx.fillRect(0,0,W,H);


    const scale=Math.min(W,H)*.011;

    const pulse=
        1+
        Math.sin(now*.003)*.025+
        Math.sin(now*.009)*.01;


    /* =========================
       BIG RED GLOW
    ========================= */

    const glow=ctx.createRadialGradient(
        heartX,
        heartY,
        0,
        heartX,
        heartY,
        scale*15
    );

    glow.addColorStop(
        0,
        "rgba(255,0,25,.30)"
    );

    glow.addColorStop(
        .25,
        "rgba(255,0,15,.14)"
    );

    glow.addColorStop(
        1,
        "rgba(255,0,0,0)"
    );

    ctx.fillStyle=glow;

    ctx.beginPath();
    ctx.arc(
        heartX,
        heartY,
        scale*15,
        0,
        Math.PI*2
    );
    ctx.fill();


    /* =========================
       MOTION RAYS
    ========================= */

    const speed=
        Math.sqrt(
            velocityX*velocityX+
            velocityY*velocityY
        );

    if(speed>2){

        ctx.save();

        for(let i=0;i<35;i++){

            const angle=
                Math.atan2(
                    velocityY,
                    velocityX
                )+
                (Math.random()-.5)*.9;

            const length=
                speed*(
                    10+
                    Math.random()*18
                );

            const x1=
                heartX-
                Math.cos(angle)*20;

            const y1=
                heartY-
                Math.sin(angle)*20;

            const x2=
                x1-
                Math.cos(angle)*length;

            const y2=
                y1-
                Math.sin(angle)*length;

            const g=ctx.createLinearGradient(
                x1,y1,x2,y2
            );

            g.addColorStop(
                0,
                "rgba(255,20,30,.25)"
            );

            g.addColorStop(
                1,
                "rgba(255,0,0,0)"
            );

            ctx.strokeStyle=g;
            ctx.lineWidth=
                Math.random()*1.4;

            ctx.beginPath();
            ctx.moveTo(x1,y1);
            ctx.lineTo(x2,y2);
            ctx.stroke();
        }

        ctx.restore();
    }


    /* =========================
       TRAIL PARTICLES
    ========================= */

    for(let i=trails.length-1;i>=0;i--){

        const p=trails[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.96;
        p.vy*=.96;

        p.life-=.025;

        if(p.life<=0){

            trails.splice(i,1);
            continue;
        }

        ctx.shadowBlur=12;
        ctx.shadowColor="#ff0015";

        ctx.fillStyle=
            `rgba(255,20,30,${p.life})`;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size*p.life,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;
    }


    /* =========================
       HEART PARTICLES
    ========================= */

    for(const p of particles){

        p.t+=p.speed;

        if(p.t>Math.PI*2)
            p.t-=Math.PI*2;

        const h=heart(p.t);

        const wobble=
            Math.sin(
                now*.003+
                p.phase
            )*1.3;

        const tx=
            heartX+
            h.x*scale*pulse+
            wobble*p.wobble;

        const ty=
            heartY+
            h.y*scale*pulse+
            wobble*.4;


        /*
          Particle trail
        */

        ctx.beginPath();

        ctx.moveTo(
            p.x,
            p.y
        );

        ctx.lineTo(
            tx,
            ty
        );

        ctx.strokeStyle=
            `rgba(255,0,20,${p.alpha*.22})`;

        ctx.lineWidth=
            p.size*.7;

        ctx.stroke();


        p.x=tx;
        p.y=ty;


        /*
          Glowing particle
        */

        ctx.shadowBlur=9;
        ctx.shadowColor="#ff0018";

        ctx.fillStyle=
            `rgba(255,
            ${25+Math.random()*40},
            ${30+Math.random()*30},
            ${p.alpha})`;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;
    }


    /* =========================
       WHITE SPARKS ON EDGE
    ========================= */

    for(let i=0;i<150;i++){

        const t=
            i/150*Math.PI*2;

        const h=heart(t);

        const x=
            heartX+
            h.x*scale*pulse;

        const y=
            heartY+
            h.y*scale*pulse;

        const flicker=
            .25+
            Math.abs(
                Math.sin(
                    now*.006+i
                )
            )*.75;

        ctx.shadowBlur=8;
        ctx.shadowColor="white";

        ctx.fillStyle=
            `rgba(255,245,245,${flicker})`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            .7+
            Math.random()*1.2,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;
    }


    /* =========================
       CENTER LIGHT
    ========================= */

    const core=ctx.createRadialGradient(
        heartX,
        heartY,
        0,
        heartX,
        heartY,
        scale*7
    );

    core.addColorStop(
        0,
        "rgba(255,60,60,.25)"
    );

    core.addColorStop(
        .4,
        "rgba(255,0,0,.12)"
    );

    core.addColorStop(
        1,
        "rgba(255,0,0,0)"
    );

    ctx.fillStyle=core;

    ctx.beginPath();

    ctx.arc(
        heartX,
        heartY,
        scale*7,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* =========================
       DRAG RIPPLE
    ========================= */

    if(dragging){

        const r=
            25+
            Math.sin(now*.01)*8;

        ctx.strokeStyle=
            "rgba(255,40,40,.25)";

        ctx.lineWidth=1;

        ctx.beginPath();

        ctx.arc(
            heartX,
            heartY,
            r,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }
}

draw();

</script>

</body>
    </html>
