}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    z-index:20;
    font-size:15px;
    letter-spacing:3px;
}

#loading.hide{
    display:none;
}
</style>

/* =========================================
   CREATE CHARACTER POINTS
========================================= */

let points = [];

function buildRobot(){

    points=[];

    const rows=robot.length;
    const cols=Math.max(...robot.map(x=>x.length));

    const cellW=7;
    const cellH=9;

    const totalW=cols*cellW;
    const totalH=rows*cellH;

    const startX=(W-totalW)/2;
    const startY=(H-totalH)/2;

    for(let y=0;y<rows;y++){

        for(let x=0;x<robot[y].length;x++){

            const char=robot[y][x];

            if(char!=="B" && char!==" "){

                points.push({
                    x:startX+x*cellW,
                    y:startY+y*cellH,
                    char:char,
                    ox:x,
                    oy:y
                });

            }
        }
    }
}

buildRobot();


/* =========================================
   FACE TRACKING VARIABLES
========================================= */

let yaw=0;
let targetYaw=0;

let pitch=0;
let targetPitch=0;

let faceFound=false;


/* =========================================
   MEDIAPIPE FACE MESH
========================================= */

const faceMesh = new FaceMesh({
    locateFile:(file)=>{
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }
});

faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.5,

    minTrackingConfidence:0.5
});


faceMesh.onResults(results=>{

    if(
        results.multiFaceLandmarks &&
        results.multiFaceLandmarks.length>0
    ){

        faceFound=true;

        const face=results.multiFaceLandmarks[0];

        /*
          Nose tip
        */
        const nose=face[1];

        /*
          Left / right face edges
        */
        const left=face[234];
        const right=face[454];

        const center=(left.x+right.x)/2;

        /*
          Calculate head rotation
        */

        targetYaw=(nose.x-center)*3.5;

        targetPitch=(nose.y-0.5)*2.0;

        targetYaw=Math.max(-1,Math.min(1,targetYaw));
        targetPitch=Math.max(-1,Math.min(1,targetPitch));

        brainText.textContent="ACTIVE";

    }else{

        faceFound=false;

        targetYaw=0;
        targetPitch=0;

        brainText.textContent="SEARCHING";
    }
});


/* =========================================
   START CAMERA
========================================= */

async function startCamera(){

    try{

        const stream=await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user",
                width:{ideal:640},
                height:{ideal:480}
            },

            audio:false
        });

        video.srcObject=stream;

        camText.textContent="ON";

        loading.classList.add("hide");

        const camera=new Camera(video,{

            onFrame:async()=>{
                await faceMesh.send({image:video});
            },

            width:640,
            height:480
        });

        camera.start();

    }catch(error){

        loading.textContent=
        "CAMERA ACCESS DENIED — PLEASE ALLOW CAMERA";

        console.error(error);
    }
}

startCamera();


/* =========================================
   ROBOT RENDER
========================================= */

function draw(){

    requestAnimationFrame(draw);

    /*
      Smooth movement
    */

    yaw += (targetYaw-yaw)*0.12;

    pitch += (targetPitch-pitch)*0.12;

    ctx.clearRect(0,0,W,H);

    /*
      Background
    */

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);

    /*
      Robot center
    */

    const centerX=W/2;
    const centerY=H/2;

    /*
      Character rendering
    */

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    for(const p of points){

        /*
          Horizontal distortion based
          on head rotation
        */

        let px=p.x;

        let py=p.y;

        const dx=px-centerX;
        const dy=py-centerY;

        /*
          Simulated 3D head rotation
        */

        const depthFactor=
            1 + Math.sin((p.oy/robot.length)*Math.PI)*0.15;

        px=centerX + dx*(1-yaw*0.22);

        /*
          Shift different parts differently.
          This creates a 3D turning effect.
        */

        px += yaw * dy * 0.28;

        py += pitch * dx * 0.12;

        /*
          Slight live movement
        */

        const breathing=
            Math.sin(Date.now()/700 + p.ox*0.03)*0.5;

        py+=breathing;

        /*
          Size
        */

        const size=
            Math.max(
                5,
                Math.min(15,7*depthFactor)
            );

        ctx.font=
            `${size}px monospace`;

        /*
          Glow
        */

        ctx.shadowBlur=12;
        ctx.shadowColor="#00ffcc";

        ctx.fillStyle="#00ffcc";

        ctx.fillText(
            p.char,
            px,
            py
        );
    }

    /*
      Face tracking indicator
    */

    if(faceFound){

        ctx.shadowBlur=0;

        ctx.font="11px monospace";

        ctx.fillStyle="#00ffcc";

        ctx.textAlign="center";

        ctx.fillText(
            "FACE TRACKING",
            W/2,
            H-25
        );

    }else{

        ctx.shadowBlur=0;

        ctx.font="11px monospace";

        ctx.fillStyle="#555";

        ctx.textAlign="center";

        ctx.fillText(
            "SEARCHING FOR FACE...",
            W/2,
            H-25
        );
    }
}

draw();
