<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxia de Amor - Thenara Magic</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 100vw;
            height: 100vh;
        }

        /* ------------------ FIRST PAGE ------------------ */
        .container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate3d(-50%, -50%, 0);
            text-align: center;
            z-index: 10;
            width: 95%;
            max-width: 500px;
            transition: opacity 1s ease;
        }

        .Flores_Amarillas {
            font-size: 2.2rem;
            font-family: 'Georgia', serif;
            color: #ffe600;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.8), 0 0 30px #ffe600;
            margin-bottom: 30px;
        }

        .go-btn {
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #ffe600;
            color: #ffe600;
            padding: 12px 35px;
            font-size: 1.5rem;
            font-family: 'Georgia', serif;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 230, 0, 0.6), inset 0 0 10px #ffe600;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px #ffe600, inset 0 0 5px #ffe600; transform: scale(1); }
            50% { box-shadow: 0 0 30px #ffe600, 0 0 12px #ffffff, inset 0 0 15px #ffe600; transform: scale(1.04); }
        }

        .flower {
            position: absolute;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #ffea00;
            animation: floatUp linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translate3d(0, 100vh, 0) scale(0); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translate3d(0, -10vh, 0) scale(1.3); opacity: 0; }
        }

        /* ------------------ 1ST PAGE BABY ------------------ */
        .baby-container {
            position: absolute;
            bottom: -280px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 230px;
            z-index: 20;
            transition: bottom 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(255, 230, 0, 0.9));
        }

        .baby-container.enter { bottom: 25px; }
        .baby-container.exit { bottom: -280px; transition: bottom 1.2s ease-in-out; }
        .talking .baby-mouth { animation: talkMouth 0.22s infinite alternate ease-in-out; }
        @keyframes talkMouth { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1.8); } }

        .yellow-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffe600;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 1s ease-in-out;
        }

        /* ------------------ SECOND PAGE ------------------ */
        .next-page {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            transition: opacity 1.5s ease;
            overflow: hidden;
        }

        #thenaraCanvas, #magicBlastCanvas {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 201;
        }

        .fairy-baby {
            position: absolute;
            width: 120px;
            height: 150px;
            z-index: 210;
            top: 30%; left: -150px;
            pointer-events: none;
            display: none;
            filter: drop-shadow(0 0 18px #ffe600);
        }

        .wing-left { transform-origin: right center; animation: flapLeft 0.15s infinite alternate ease-in-out; }
        .wing-right { transform-origin: left center; animation: flapRight 0.15s infinite alternate ease-in-out; }
        @keyframes flapLeft { 0% { transform: rotate(0deg) scaleX(1); } 100% { transform: rotate(-28deg) scaleX(0.3); } }
        @keyframes flapRight { 0% { transform: rotate(0deg) scaleX(1); } 100% { transform: rotate(28deg) scaleX(0.3); } }

        /* ------------------ THIRD PAGE (HIGH GRAPHICS SUNFLOWERS) ------------------ */
        .third-page {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1f1a00 0%, #050505 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 300;
            transition: opacity 1.5s ease;
            overflow: hidden;
        }

        #vineCanvas {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 305;
        }

        /* Glowing Sunflowers Container */
        .sunflower-container {
            position: absolute;
            z-index: 310;
            width: 100vw; height: 100vh;
            pointer-events: none;
        }

        .sunflower {
            position: absolute;
            width: 90px;
            height: 90px;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            transform: scale(0) rotate(-180deg);
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s;
            filter: drop-shadow(0 0 15px #ffe600);
        }

        .sunflower.bloom {
            opacity: 1;
            transform: scale(1) rotate(0deg);
            animation: floatFlower 3s ease-in-out infinite alternate;
        }

        @keyframes floatFlower {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-10px) scale(1.05); }
        }

        /* Custom Star Particle Shower from Flowers */
        .star-dust {
            position: absolute;
            color: #ffe600;
            font-size: 14px;
            pointer-events: none;
            z-index: 308;
            animation: starFall linear forwards;
            text-shadow: 0 0 8px #ffe600;
        }

        @keyframes starFall {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(180px) scale(0.2) rotate(360deg); opacity: 0; }
        }

        /* ------------------ YELLOW & BLACK CHAT POPUP ------------------ */
        .chat-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 85%;
            max-width: 380px;
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #ffe600;
            box-shadow: 0 0 30px rgba(255, 230, 0, 0.5), inset 0 0 15px rgba(255, 230, 0, 0.2);
            border-radius: 20px;
            padding: 20px;
            z-index: 400;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chat-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 230, 0, 0.3);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .chat-title {
            color: #ffe600;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
            text-shadow: 0 0 8px #ffe600;
        }

        .close-chat {
            color: #ffe600;
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .chat-body {
            color: #fff;
            font-size: 0.98rem;
            line-height: 1.6;
            background: rgba(30, 30, 30, 0.8);
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #ffe600;
        }
    </style>
</head>

    <script>
        let spawnInterval = setInterval(createFlower, 180);

        function createFlower() {
            const flower = document.createElement('div');
            flower.classList.add('flower');
            flower.style.width = '6px';
            flower.style.height = '6px';
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(flower);
            setTimeout(() => flower.remove(), 5000);
        }

        let hasTriggered = false;
        function triggerBabyAnimation() {
            if (hasTriggered) return;
            hasTriggered = true;
            const baby = document.getElementById('babyCharacter');
            const voice = document.getElementById('babyVoice');

            setTimeout(() => {
                baby.classList.add('enter');
                setTimeout(() => {
                    voice.play().then(() => baby.classList.add('talking')).catch(() => {});
                }, 1200);
            }, 2000);

            voice.addEventListener('ended', () => {
                baby.classList.remove('talking', 'enter');
                baby.classList.add('exit');
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            triggerBabyAnimation();
            const enableAudio = () => {
                triggerBabyAnimation();
                window.removeEventListener('touchstart', enableAudio);
                window.removeEventListener('click', enableAudio);
            };
            window.addEventListener('touchstart', enableAudio);
            window.addEventListener('click', enableAudio);
        });

        function startTransition() {
            clearInterval(spawnInterval);
            document.getElementById('mainContainer').style.opacity = '0';
            setTimeout(() => document.getElementById('overlay').style.opacity = '1', 600);
            setTimeout(() => {
                document.getElementById('nextPage').style.opacity = '1';
                document.getElementById('nextPage').style.pointerEvents = 'auto';
                initSecondPage();
            }, 1800);
        }

        /* ------------------ SECOND PAGE LOGIC ------------------ */
        let fairyX = -150, fairyY = window.innerHeight * 0.3;

        function initSecondPage() {
            const canvas = document.getElementById('thenaraCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const fairy = document.getElementById('fairyBaby');
            fairy.style.display = 'block';

            const particles = [];
            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * (canvas.width - 80),
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    size: Math.random() * 4 + 10
                });
            }

            let startTime = null;
            function flyStep(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = (timestamp - startTime) / 1000;

                if (progress < 1.5) {
                    fairyX = -150 + (canvas.width * 0.5 + 150) * (progress / 1.5);
                    fairyY = canvas.height * 0.3 + Math.sin(progress * 8) * 40;
                } else if (progress < 4.0) {
                    fairyX = canvas.width / 2 + Math.sin(progress * 5) * (canvas.width * 0.35);
                    fairyY = canvas.height / 2 + Math.cos(progress * 6) * (canvas.height * 0.25);
                } else if (progress < 5.0) {
                    fairyX += (canvas.width / 2 - 60 - fairyX) * 0.1;
                    fairyY += (canvas.height / 2 - 75 - fairyY) * 0.1;
                } else if (progress >= 5.0) {
                    triggerMagicBallsBlast(canvas.width / 2, canvas.height / 2);
                    return;
                }

                fairy.style.left = fairyX + 'px';
                fairy.style.top = fairyY + 'px';

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    let dx = p.x - (fairyX + 60);
                    let dy = p.y - (fairyY + 75);
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 140) {
                        let force = (140 - dist) / 140;
                        p.x += (dx / dist) * force * 18;
                        p.y += (dy / dist) * force * 18;
                    } else {
                        p.x += p.vx;
                        p.y += p.vy;
                    }

                    ctx.save();
                    ctx.font = `600 ${p.size}px Georgia, serif`;
                    ctx.fillStyle = '#ffe600';
                    ctx.shadowColor = '#ffe600';
                    ctx.shadowBlur = 8;
                    ctx.fillText('THENARA', p.x, p.y);
                    ctx.restore();
                });

                requestAnimationFrame(flyStep);
            }
            requestAnimationFrame(flyStep);
        }

        /* MAGIC BLAST & TRANSITION TO 3RD PAGE */
        function triggerMagicBallsBlast(centerX, centerY) {
            const bCanvas = document.getElementById('magicBlastCanvas');
            const bCtx = bCanvas.getContext('2d');
            bCanvas.width = window.innerWidth;
            bCanvas.height = window.innerHeight;

            const magicBalls = [];
            for (let i = 0; i < 35; i++) {
                magicBalls.push({
                    x: centerX, y: centerY,
                    vx: (Math.random() - 0.5) * 24, vy: (Math.random() - 0.5) * 24,
                    radius: Math.random() * 10 + 5, growth: Math.random() * 2 + 2
                });
            }

            function animateBlast() {
                bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
                let allBig = true;

                magicBalls.forEach(ball => {
                    ball.x += ball.vx; ball.y += ball.vy;
                    ball.radius += ball.growth;

                    bCtx.beginPath();
                    bCtx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                    bCtx.fillStyle = '#ffe600';
                    bCtx.shadowColor = '#ffe600';
                    bCtx.shadowBlur = 20;
                    bCtx.fill();

                    if (ball.radius < Math.max(bCanvas.width, bCanvas.height)) allBig = false;
                });

                if (!allBig) {
                    requestAnimationFrame(animateBlast);
                } else {
                    // Transition to 3rd Page Smoothly
                    document.getElementById('nextPage').style.opacity = '0';
                    const thirdPage = document.getElementById('thirdPage');
                    thirdPage.style.opacity = '1';
                    thirdPage.style.pointerEvents = 'auto';
                    initVineAnimation();
                }
            }
            animateBlast();
        }

        /* ------------------ THIRD PAGE (ANIMATED VINES + SUNFLOWERS) ------------------ */
        function initVineAnimation() {
            const canvas = document.getElementById('vineCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let progress = 0;

            function drawVines() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#ffe600';
                ctx.shadowColor = '#ffe600';
                ctx.shadowBlur = 12;

                if (progress < 1) progress += 0.015;

                // Vine 1 (Left - Curved Left)
                ctx.beginPath();
                ctx.moveTo(canvas.width * 0.45, canvas.height);
                ctx.quadraticCurveTo(
                    canvas.width * 0.1, canvas.height * 0.7,
                    canvas.width * 0.2, canvas.height * 0.38
                );
                ctx.stroke();

                // Vine 2 (Middle - Curved Slightly Left ~1 inch)
                ctx.beginPath();
                ctx.moveTo(canvas.width * 0.5, canvas.height);
                ctx.quadraticCurveTo(
                    canvas.width * 0.38, canvas.height * 0.6,
                    canvas.width * 0.43, canvas.height * 0.28
                );
                ctx.stroke();

                // Vine 3 (Right - Curved Right)
                ctx.beginPath();
                ctx.moveTo(canvas.width * 0.55, canvas.height);
                ctx.quadraticCurveTo(
                    canvas.width * 0.9, canvas.height * 0.7,
                    canvas.width * 0.75, canvas.height * 0.41
                );
                ctx.stroke();

                if (progress < 1) {
                    requestAnimationFrame(drawVines);
                } else {
                    // Bloom Flowers after Vines finish drawing!
                    document.getElementById('flowerLeft').classList.add('bloom');
                    document.getElementById('flowerMid').classList.add('bloom');
                    document.getElementById('flowerRight').classList.add('bloom');
                    
                    startStarDustShower();
                }
            }
            drawVines();
        }

        /* Star Dust Shower from Blooming Flowers */
        function startStarDustShower() {
            setInterval(() => {
                const flowers = [
                    { x: window.innerWidth * 0.2, y: window.innerHeight * 0.38 },
                    { x: window.innerWidth * 0.43, y: window.innerHeight * 0.28 },
                    { x: window.innerWidth * 0.75, y: window.innerHeight * 0.41 }
                ];
                
                const f = flowers[Math.floor(Math.random() * flowers.length)];
                const star = document.createElement('div');
                star.classList.add('star-dust');
                star.innerText = Math.random() > 0.5 ? '✦' : '★';
                star.style.left = (f.x + (Math.random() - 0.5) * 40) + 'px';
                star.style.top = (f.y + 30) + 'px';

                document.getElementById('thirdPage').appendChild(star);
                setTimeout(() => star.remove(), 2000);
            }, 150);
        }

        /* CHAT MODAL LOGIC */
        function openChat(title) {
            document.getElementById('chatTitle').innerText = title;
            document.getElementById('chatBox').classList.add('active');
        }

        function closeChat() {
            document.getElementById('chatBox').classList.remove('active');
        }
    </script>

</body>
</html>
