<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxia de Amor - Thenara</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 100vw;
            height: 100vh;
        }

        /* ------------------ FIRST PAGE ------------------ */
        .container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate3d(-50%, -50%, 0);
            text-align: center;
            z-index: 10;
            width: 95%;
            max-width: 500px;
            transition: opacity 1s ease;
        }

        .Flores_Amarillas {
            font-size: 2.2rem;
            font-family: 'Georgia', serif;
            color: #ffe600;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.7);
            margin-bottom: 30px;
        }

        .go-btn {
            background: rgba(5, 5, 5, 0.9);
            border: 2px solid #ffe600;
            color: #ffe600;
            padding: 10px 30px;
            font-size: 1.5rem;
            font-family: 'Georgia', serif;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px #ffe600; }
            50% { box-shadow: 0 0 22px #ffe600, 0 0 8px #ffffff; }
        }

        .flower {
            position: absolute;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffd700;
            animation: floatUp linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translate3d(0, 100vh, 0) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translate3d(0, -10vh, 0) scale(1.2); opacity: 0; }
        }

        /* ------------------ 1ST PAGE BABY ------------------ */
        .baby-container {
            position: absolute;
            bottom: -280px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 230px;
            z-index: 20;
            transition: bottom 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            filter: drop-shadow(0 0 18px rgba(255, 230, 0, 0.8));
        }

        .baby-container.enter { bottom: 25px; }
        .baby-container.exit { bottom: -280px; transition: bottom 1.2s ease-in-out; }

        .talking .baby-mouth { animation: talkMouth 0.22s infinite alternate ease-in-out; }
        @keyframes talkMouth { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1.8); } }

        .yellow-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffe600;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 1s ease-in-out;
        }

        /* ------------------ SECOND PAGE ------------------ */
        .next-page {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            transition: opacity 1.5s ease;
            overflow: hidden;
        }

        #thenaraCanvas {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 201;
        }

        /* ------------------ FAIRY FLYING BABY (2ND PAGE) ------------------ */
        .fairy-baby {
            position: absolute;
            width: 120px;
            height: 150px;
            z-index: 210;
            top: 30%;
            left: -150px; /* Start outside screen */
            pointer-events: none;
            display: none;
            filter: drop-shadow(0 0 15px #ffe600);
        }

        /* Flapping Wings Animation */
        .wing-left {
            transform-origin: right center;
            animation: flapLeft 0.15s infinite alternate ease-in-out;
        }
        .wing-right {
            transform-origin: left center;
            animation: flapRight 0.15s infinite alternate ease-in-out;
        }

        @keyframes flapLeft { 0% { transform: rotate(0deg) scaleX(1); } 100% { transform: rotate(-25deg) scaleX(0.4); } }
        @keyframes flapRight { 0% { transform: rotate(0deg) scaleX(1); } 100% { transform: rotate(25deg) scaleX(0.4); } }

        /* Magic Blast Overlay Canvas */
        #magicBlastCanvas {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 215;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="yellow-overlay" id="overlay"></div>

    <!-- FIRST PAGE CONTAINER -->
    <div class="container" id="mainContainer">
        <div class="Flores_Amarillas">
            💛 Happy birthday Thenara 💛
        </div>
        <button class="go-btn" id="goButton" onclick="startTransition()">go</button>
    </div>

    <!-- FIRST PAGE BABY -->
    <div class="baby-container" id="babyCharacter">
        <svg viewBox="0 0 200 240" width="100%" height="100%">
            <path d="M 30 110 C 20 20, 180 20, 170 110 Z" fill="#3b2210"/>
            <path d="M 60 140 Q 100 130 140 140 L 160 215 C 160 225, 40 225, 40 215 Z" fill="#ffe600"/>
            <rect x="45" y="55" width="110" height="95" rx="35" fill="#fff0e1"/>
            <ellipse cx="75" cy="98" rx="10" ry="13" fill="#2b1a0e"/>
            <ellipse cx="125" cy="98" rx="10" ry="13" fill="#2b1a0e"/>
            <rect x="43" y="50" width="114" height="16" rx="8" fill="#ffe600"/>
            <ellipse class="baby-mouth" cx="100" cy="122" rx="7" ry="5" fill="#e64a19"/>
        </svg>
    </div>

    <audio id="babyVoice" src="Convert_lv_0_20260911223306.mp3" preload="auto"></audio>

    <!-- SECOND PAGE CONTAINER -->
    <div class="next-page" id="nextPage">
        <canvas id="thenaraCanvas"></canvas>
        <canvas id="magicBlastCanvas"></canvas>

        <!-- FLYING FAIRY BABY WITH WINGS AND WAND -->
        <div class="fairy-baby" id="fairyBaby">
            <svg viewBox="0 0 200 240" width="100%" height="100%">
                <!-- Wings -->
                <path class="wing-left" d="M 50 80 C 0 20, -20 100, 50 110 Z" fill="#fff59d" opacity="0.8"/>
                <path class="wing-right" d="M 150 80 C 200 20, 220 100, 150 110 Z" fill="#fff59d" opacity="0.8"/>

                <!-- Body & Dress -->
                <path d="M 60 130 Q 100 120 140 130 L 155 190 C 155 200, 45 200, 45 190 Z" fill="#ffe600"/>
                <rect x="50" y="50" width="100" height="85" rx="30" fill="#fff0e1"/>
                <ellipse cx="75" cy="88" rx="8" ry="11" fill="#2b1a0e"/>
                <ellipse cx="125" cy="88" rx="8" ry="11" fill="#2b1a0e"/>

                <!-- Magic Wand in Hand -->
                <line x1="140" y1="120" x2="185" y2="80" stroke="#ffd700" stroke-width="4"/>
                <polygon points="185,70 190,80 200,82 192,90 195,100 185,93 175,100 178,90 170,82 180,80" fill="#ffffff" filter="drop-shadow(0 0 5px #ffe600)"/>
            </svg>
        </div>
    </div>

    <script>
        let spawnInterval = setInterval(createFlower, 180);

        function createFlower() {
            const flower = document.createElement('div');
            flower.classList.add('flower');
            flower.style.width = '6px';
            flower.style.height = '6px';
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(flower);
            setTimeout(() => flower.remove(), 5000);
        }

        // Voice Trigger
        let hasTriggered = false;
        function triggerBabyAnimation() {
            if (hasTriggered) return;
            hasTriggered = true;
            const baby = document.getElementById('babyCharacter');
            const voice = document.getElementById('babyVoice');

            setTimeout(() => {
                baby.classList.add('enter');
                setTimeout(() => {
                    voice.play().then(() => baby.classList.add('talking')).catch(() => {});
                }, 1200);
            }, 2000);

            voice.addEventListener('ended', () => {
                baby.classList.remove('talking', 'enter');
                baby.classList.add('exit');
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            triggerBabyAnimation();
            const enableAudio = () => {
                triggerBabyAnimation();
                window.removeEventListener('touchstart', enableAudio);
                window.removeEventListener('click', enableAudio);
            };
            window.addEventListener('touchstart', enableAudio);
            window.addEventListener('click', enableAudio);
        });

        function startTransition() {
            clearInterval(spawnInterval);
            document.getElementById('mainContainer').style.opacity = '0';
            setTimeout(() => document.getElementById('overlay').style.opacity = '1', 600);
            setTimeout(() => {
                document.getElementById('nextPage').style.opacity = '1';
                document.getElementById('nextPage').style.pointerEvents = 'auto';
                initSecondPage();
            }, 1800);
        }

        /* ------------------ SECOND PAGE FLYING & BLAST LOGIC ------------------ */
        let fairyX = -150, fairyY = window.innerHeight * 0.3;

        function initSecondPage() {
            const canvas = document.getElementById('thenaraCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const fairy = document.getElementById('fairyBaby');
            fairy.style.display = 'block';

            // Particles Array for "THENARA"
            const particles = [];
            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * (canvas.width - 80),
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    size: Math.random() * 4 + 10
                });
            }

            // Flying Animation Sequence
            let startTime = null;
            function flyStep(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = (timestamp - startTime) / 1000;

                if (progress < 1.5) {
                    // Fly in fast from left
                    fairyX = -150 + (canvas.width * 0.5 + 150) * (progress / 1.5);
                    fairyY = canvas.height * 0.3 + Math.sin(progress * 8) * 40;
                } else if (progress < 4.0) {
                    // Rapid Zig-Zag Flying Across Screen
                    fairyX = canvas.width / 2 + Math.sin(progress * 5) * (canvas.width * 0.35);
                    fairyY = canvas.height / 2 + Math.cos(progress * 6) * (canvas.height * 0.25);
                } else if (progress < 5.0) {
                    // Move to Exact Center
                    fairyX += (canvas.width / 2 - 60 - fairyX) * 0.1;
                    fairyY += (canvas.height / 2 - 75 - fairyY) * 0.1;
                } else if (progress >= 5.0) {
                    // Magic Blast Event Trigger!
                    triggerMagicBallsBlast(canvas.width / 2, canvas.height / 2);
                    return;
                }

                fairy.style.left = fairyX + 'px';
                fairy.style.top = fairyY + 'px';

                // Draw THENARA Particles & Make them REPEL away from Fairy!
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    // Calculate distance to Fairy
                    let dx = p.x - (fairyX + 60);
                    let dy = p.y - (fairyY + 75);
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    // Push Particles away from Fairy!
                    if (dist < 140) {
                        let force = (140 - dist) / 140;
                        p.x += (dx / dist) * force * 18;
                        p.y += (dy / dist) * force * 18;
                    } else {
                        p.x += p.vx;
                        p.y += p.vy;
                    }

                    ctx.save();
                    ctx.font = `600 ${p.size}px Georgia, serif`;
                    ctx.fillStyle = '#ffe600';
                    ctx.shadowColor = '#ffe600';
                    ctx.shadowBlur = 8;
                    ctx.fillText('THENARA', p.x, p.y);
                    ctx.restore();
                });

                requestAnimationFrame(flyStep);
            }

            requestAnimationFrame(flyStep);
        }

        /* Magic Yellow Balls Expansion & Full Yellow Cover */
        function triggerMagicBallsBlast(centerX, centerY) {
            const bCanvas = document.getElementById('magicBlastCanvas');
            const bCtx = bCanvas.getContext('2d');
            bCanvas.width = window.innerWidth;
            bCanvas.height = window.innerHeight;

            const magicBalls = [];
            for (let i = 0; i < 30; i++) {
                magicBalls.push({
                    x: centerX,
                    y: centerY,
                    vx: (Math.random() - 0.5) * 22,
                    vy: (Math.random() - 0.5) * 22,
                    radius: Math.random() * 10 + 5,
                    growth: Math.random() * 2 + 1.5
                });
            }

            function animateBlast() {
                bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
                let allBig = true;

                magicBalls.forEach(ball => {
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                    ball.radius += ball.growth;

                    bCtx.beginPath();
                    bCtx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                    bCtx.fillStyle = '#ffe600';
                    bCtx.shadowColor = '#ffe600';
                    bCtx.shadowBlur = 20;
                    bCtx.fill();

                    if (ball.radius < Math.max(bCanvas.width, bCanvas.height)) {
                        allBig = false;
                    }
                });

                if (!allBig) {
                    requestAnimationFrame(animateBlast);
                } else {
                    // Full Screen Turned Yellow! Ready for next instructions
                    console.log("Page transformed to solid yellow/magic background!");
                }
            }

            animateBlast();
        }
    </script>
</body>
</html>
