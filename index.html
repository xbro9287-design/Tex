<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxia de Amor - Thenara</title>
    <style>
        :root {
            --letter-love: 200px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
        }

        /* ------------------ FIRST PAGE ------------------ */
        .container {
            position: absolute;
            top: 40%;
            left: 50%;
            -webkit-transform: translate3d(-50%, -50%, 0);
            transform: translate3d(-50%, -50%, 0);
            text-align: center;
            z-index: 10;
            width: 95%;
            max-width: 500px;
            transition: opacity 1s ease;
        }

        .Flores_Amarillas {
            font-size: 2.2rem;
            font-family: 'Georgia', serif;
            color: #ffe600;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.7);
            white-space: nowrap;
            margin-bottom: 30px;
            text-align: center;
        }

        .go-btn {
            background: rgba(5, 5, 5, 0.9);
            border: 2px solid #ffe600;
            color: #ffe600;
            padding: 10px 30px;
            font-size: 1.5rem;
            font-family: 'Georgia', cursive, serif;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            display: inline-block;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4), inset 0 0 10px rgba(255, 230, 0, 0.3);
            -webkit-animation: floatButtonMobile 2.5s ease-in-out infinite, pulseGlow 2s infinite ease-in-out;
            animation: floatButtonMobile 2.5s ease-in-out infinite, pulseGlow 2s infinite ease-in-out;
            will-change: transform, box-shadow;
        }

        @-webkit-keyframes floatButtonMobile {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -9px, 0); }
        }
        @keyframes floatButtonMobile {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -9px, 0); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px #ffe600, inset 0 0 6px #ffe600; }
            50% { box-shadow: 0 0 20px #ffe600, 0 0 8px #ffffff, inset 0 0 12px #ffe600; }
        }

        .btn-star {
            position: absolute;
            color: #ffe600;
            font-size: 10px;
            pointer-events: none;
            opacity: 0.8;
            animation: innerStarMove 2s ease-in-out infinite alternate;
        }

        @keyframes innerStarMove {
            0% { transform: translate3d(0, 0, 0) scale(0.8); opacity: 0.3; }
            100% { transform: translate3d(4px, -5px, 0) scale(1.2); opacity: 0.9; }
        }

        /* 1st Page Yellow Particles */
        .flower {
            position: absolute;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffd700, 0 0 15px #ffae00;
            animation: floatUp linear infinite;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes floatUp {
            0% { transform: translate3d(0, 100vh, 0) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translate3d(0, -10vh, 0) scale(1.2); opacity: 0; }
        }

        /* ------------------ CUTE BOX/AVATAR BABY CHARACTER ------------------ */
        .baby-container {
            position: absolute;
            bottom: -280px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 230px;
            z-index: 20;
            transition: bottom 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            filter: drop-shadow(0 0 18px rgba(255, 230, 0, 0.8));
        }

        .baby-container.enter {
            bottom: 25px;
        }

        .baby-container.exit {
            bottom: -280px;
            transition: bottom 1.2s ease-in-out;
        }

        /* Lip Sync Movement Animation */
        .talking .baby-mouth {
            animation: talkMouth 0.22s infinite alternate ease-in-out;
        }

        @keyframes talkMouth {
            0% { transform: scaleY(0.2) scaleX(0.8); }
            100% { transform: scaleY(1.9) scaleX(1.1); }
        }

        .yellow-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffe600;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 1s ease-in-out;
        }

        /* ------------------ SECOND PAGE ------------------ */
        .next-page {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            transition: opacity 2s ease;
            overflow: hidden;
        }

        .next-page h1 {
            color: #ffe600;
            font-size: 2rem;
            text-shadow: 0 0 15px #ffe600;
            font-family: 'Georgia', serif;
            text-align: center;
            margin: 0 15px;
            line-height: 1.4;
            z-index: 205;
            pointer-events: none;
        }

        #thenaraCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 201;
        }
    </style>
</head>
<body>

    <div class="yellow-overlay" id="overlay"></div>

    <!-- FIRST PAGE CONTAINER -->
    <div class="container" id="mainContainer">
        <div class="Flores_Amarillas">
            💛 Happy birthday Thenara 💛
        </div>
        
        <button class="go-btn" id="goButton" onclick="startTransition()">
            <span class="btn-star" style="top: 3px; left: 5px; animation-delay: 0s;">✦</span>
            <span class="btn-star" style="bottom: 3px; left: 10px; animation-delay: 0.5s;">◆</span>
            <span class="btn-star" style="top: 4px; right: 6px; animation-delay: 1s;">✦</span>
            <span class="btn-star" style="bottom: 3px; right: 10px; animation-delay: 1.5s;">★</span>
            go
        </button>
    </div>

    <!-- NEW CUTE CHIBI CARTOON BABY (SVG) -->
    <div class="baby-container" id="babyCharacter">
        <svg viewBox="0 0 200 240" width="100%" height="100%">
            <!-- Hair Background -->
            <path d="M 30 110 C 20 20, 180 20, 170 110 C 175 160, 25 160, 30 110 Z" fill="#3b2210"/>
            
            <!-- Dress / Cute Yellow Outfit -->
            <path d="M 60 140 Q 100 130 140 140 L 160 215 C 160 225, 40 225, 40 215 Z" fill="#ffe600" stroke="#ffd700" stroke-width="3"/>
            <path d="M 75 140 L 100 160 L 125 140 Z" fill="#ffffff" opacity="0.9"/>
            <circle cx="100" cy="175" r="4" fill="#3b2210"/>

            <!-- Head Frame (Chibi Rounded Box Face) -->
            <rect x="45" y="55" width="110" height="95" rx="35" ry="35" fill="#fff0e1" stroke="#ffcca8" stroke-width="2"/>

            <!-- Cheeks / Blush -->
            <ellipse cx="65" cy="115" rx="12" ry="7" fill="#ff9999" opacity="0.6"/>
            <ellipse cx="135" cy="115" rx="12" ry="7" fill="#ff9999" opacity="0.6"/>

            <!-- Cute Big Eyes -->
            <ellipse cx="75" cy="98" rx="10" ry="13" fill="#2b1a0e"/>
            <ellipse cx="125" cy="98" rx="10" ry="13" fill="#2b1a0e"/>
            <circle cx="72" cy="93" r="4" fill="#ffffff"/>
            <circle cx="123" cy="93" r="4" fill="#ffffff"/>
            <circle cx="78" cy="103" r="2" fill="#ffffff"/>
            <circle cx="128" cy="103" r="2" fill="#ffffff"/>

            <!-- Hair Front / Bangs & Yellow Hairband -->
            <rect x="43" y="50" width="114" height="16" rx="8" ry="8" fill="#ffe600"/>
            <path d="M 85 45 Q 100 35 115 45 Q 100 55 85 45 Z" fill="#ffae00"/>
            <path d="M 45 75 C 55 45, 145 45, 155 75 C 135 60, 115 70, 100 60 C 85 70, 65 60, 45 75 Z" fill="#4a2c11"/>

            <!-- Mouth for Lip Sync Animation -->
            <g id="mouthGroup">
                <ellipse class="baby-mouth" cx="100" cy="122" rx="7" ry="5" fill="#e64a19" style="transform-origin: 100px 122px;"/>
            </g>
        </svg>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="babyVoice" src="Convert_lv_0_20260911223306.mp3" preload="auto"></audio>

    <!-- SECOND PAGE CONTAINER -->
    <div class="next-page" id="nextPage">
        <canvas id="thenaraCanvas"></canvas>
        <h1>✨ May all your dreams come true! ✨</h1>
    </div>

    <script>
        // ---------------- FIRST PAGE LOGIC ----------------
        let spawnInterval = setInterval(createFlower, 180);

        function createFlower(isExplosion = false) {
            const flower = document.createElement('div');
            flower.classList.add('flower');

            const sizeNum = isExplosion ? Math.random() * 20 + 8 : Math.random() * 6 + 4;
            flower.style.width = sizeNum + 'px';
            flower.style.height = sizeNum + 'px';
            flower.style.left = Math.random() * 100 + 'vw';

            const duration = isExplosion ? (Math.random() * 1.5 + 1) : (Math.random() * 3 + 3);
            flower.style.animationDuration = duration + 's';

            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }

        // ---------------- AUTOPLAY & BABY VOICE LOGIC ----------------
        let hasTriggered = false;

        function triggerBabyAnimation() {
            if (hasTriggered) return;
            hasTriggered = true;

            const baby = document.getElementById('babyCharacter');
            const voice = document.getElementById('babyVoice');

            // 3 Seconds Delay to Float Up
            setTimeout(() => {
                baby.classList.add('enter');

                setTimeout(() => {
                    voice.play().then(() => {
                        baby.classList.add('talking');
                    }).catch(e => {
                        console.log("Audio autoplay prevented by browser.");
                    });
                }, 1200);

            }, 3000);

            // Voice End Event -> Stop Mouth & Float Down
            voice.addEventListener('ended', () => {
                baby.classList.remove('talking');
                baby.classList.remove('enter');
                baby.classList.add('exit');
            });
        }

        // Global User Touch/Click Listener for guaranteed Smooth Autoplay
        window.addEventListener('DOMContentLoaded', () => {
            // First attempt direct trigger
            triggerBabyAnimation();

            // Touch fallback to bypass browser autoplay blocks
            const enableAudio = () => {
                triggerBabyAnimation();
                const voice = document.getElementById('babyVoice');
                voice.play().then(() => {
                    voice.pause();
                    voice.currentTime = 0;
                }).catch(() => {});
                window.removeEventListener('touchstart', enableAudio);
                window.removeEventListener('click', enableAudio);
            };

            window.addEventListener('touchstart', enableAudio);
            window.addEventListener('click', enableAudio);
        });

        function startTransition() {
            clearInterval(spawnInterval);
            let explosionInterval = setInterval(() => {
                createFlower(true);
            }, 25);

            document.getElementById('mainContainer').style.opacity = '0';

            setTimeout(() => {
                document.getElementById('overlay').style.opacity = '1';
            }, 800);

            setTimeout(() => {
                clearInterval(explosionInterval);
                document.getElementById('nextPage').style.opacity = '1';
                document.getElementById('nextPage').style.pointerEvents = 'auto';
                initThenaraCanvas(); // 2nd page canvas initiation
            }, 2000);
        }

        // ---------------- SECOND PAGE LOGIC (THENARA ADVANCED ANIMATION) ----------------
        function initThenaraCanvas() {
            const canvas = document.getElementById('thenaraCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const particles = [];
            const particleCount = 40;

            let targetX = canvas.width / 2;
            let targetY = canvas.height / 2;
            let isHolding = false;

            class ThenaraParticle {
                constructor() {
                    this.size = Math.random() * 4 + 9;
                    this.textWidth = this.size * 5; 
                    this.resetInitial();
                    this.opacity = Math.random() * 0.5 + 0.4;
                }

                resetInitial() {
                    this.x = Math.random() * (canvas.width - 60);
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.6;
                    this.vy = (Math.random() - 0.5) * 0.6;
                }

                update() {
                    if (isHolding) {
                        const dx = targetX - this.x;
                        const dy = targetY - this.y;
                        this.x += dx * 0.035;
                        this.y += dy * 0.035;
                    } else {
                        this.x += this.vx;
                        this.y += this.vy;

                        if (this.x < 0 || this.x > canvas.width - 50) this.vx *= -1;
                        if (this.y < 20 || this.y > canvas.height) this.vy *= -1;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.font = `600 ${this.size}px Georgia, serif`;
                    ctx.fillStyle = '#ffe600';
                    ctx.globalAlpha = this.opacity;
                    ctx.shadowColor = '#ffe600';
                    ctx.shadowBlur = 6;
                    ctx.fillText('THENARA', this.x, this.y);
                    ctx.restore();
                }
            }

            for (let i = 0; i < particleCount; i++) {
                particles.push(new ThenaraParticle());
            }

            function startHold(e) {
                isHolding = true;
                updateTarget(e);
            }

            function moveHold(e) {
                if (isHolding) {
                    updateTarget(e);
                }
            }

            function endHold() {
                isHolding = false;
            }

            function updateTarget(e) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                targetX = clientX;
                targetY = clientY;
            }

            window.addEventListener('mousedown', startHold);
            window.addEventListener('mousemove', moveHold);
            window.addEventListener('mouseup', endHold);

            window.addEventListener('touchstart', startHold);
            window.addEventListener('touchmove', moveHold);
            window.addEventListener('touchend', endHold);

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const p1 = particles[i];
                        const p2 = particles[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 35 && !isHolding) {
                            p1.x += dx * 0.02;
                            p1.y += dy * 0.02;
                            p2.x -= dx * 0.02;
                            p2.y -= dy * 0.02;
                        }
                    }
                }

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>

</body>
</html>
