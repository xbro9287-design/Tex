<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misti - AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f4f1ea; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    .chat-card { width: 100%; max-width: 400px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 90vh; }
    .header { background: #3c2a21; color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; word-wrap: break-word; font-size: 0.95rem; line-height: 1.4; }
    .user { background: #d3e3fd; align-self: flex-end; color: #000; }
    .bot { background: #f0f0f0; align-self: flex-start; color: #333; }
    .input-area { display: flex; padding: 10px; background: #fff; border-top: 1px solid #eee; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    button { background: #3c2a21; color: white; border: none; padding: 10px 15px; margin-left: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="chat-card">
  <div class="header">Chat with Misti ✨</div>
  <div class="chat-box" id="chatBox">
    <div class="msg bot">Hello! I am Misti. How can I help you today?</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  // Manifest Key and URL Added Directly
  const API_KEY = "mnfst_AFS1hPkKSC_1QeAqb1ALHUABWhuAMZ1Bk-8hdcrRZvM"; 
  const BASE_URL = "https://app.manifest.build/v1/chat/completions";

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const text = input.value.trim();
    if (!text) return;

    // Display User Message
    chatBox.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // Display Loading Message
    const loadingDiv = document.createElement("div");
    loadingDiv.className = "msg bot";
    loadingDiv.innerText = "Misti is thinking...";
    chatBox.appendChild(loadingDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const response = await fetch(BASE_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: "auto",
          messages: [
            { role: "system", content: "You are Misti, a friendly and smart AI beauty advisor." },
            { role: "user", content: text }
          ]
        })
      });

      const data = await response.json();
      if (data.choices && data.choices[0] && data.choices[0].message) {
        loadingDiv.innerText = data.choices[0].message.content;
      } else {
        loadingDiv.innerText = "Sorry, Misti couldn't process that response.";
      }
    } catch (err) {
      loadingDiv.innerText = "Error connecting to Misti. Please try again.";
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
