<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Amor - Thenara</title>
    <style>
        :root {
            --letter-love: 200px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: Arial, sans-serif;
            transition: background-color 1.5s ease;
        }

        /* හරියටම තිරයේ මැදට ගන්න Container එක */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            transition: opacity 1s ease;
        }

        /* එක පේළියට තියෙන කුඩා Text එක */
        .Flores_Amarillas {
            font-size: 1.1rem; /* ගොඩක් කුඩා, Clean ප්‍රමාණය */
            font-family: 'Georgia', serif;
            color: #ffe600;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.6);
            white-space: nowrap; /* එක පේළියක පමණක් තැබීමට */
            margin-bottom: 20px;
        }

        /* කුඩා, පාවෙන "GO" Button එක */
        .go-btn {
            background: rgba(5, 5, 5, 0.9);
            border: 1.5px solid #ffe600;
            color: #ffe600;
            padding: 4px 16px;
            font-size: 0.9rem; /* කුඩා Button Text */
            font-family: 'Georgia', cursive, serif;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            display: inline-block;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(255, 230, 0, 0.4), inset 0 0 6px rgba(255, 230, 0, 0.3);
            
            /* Smooth වෙන්ව පාවෙන Animation එක */
            animation: floatButton 2.5s ease-in-out infinite, pulseGlow 2s infinite ease-in-out;
            transition: transform 0.3s ease;
        }

        /* බටන් එක හිමීට පාවෙන Animation එක */
        @keyframes floatButton {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* බටන් Glow එක */
        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 8px #ffe600, inset 0 0 5px #ffe600;
            }
            50% {
                box-shadow: 0 0 15px #ffe600, 0 0 5px #ffffff, inset 0 0 8px #ffe600;
            }
        }

        /* බටන් එක ඇතුළේ ඇනිමේට් වෙන කුඩා තරු */
        .btn-star {
            position: absolute;
            color: #ffe600;
            font-size: 7px;
            pointer-events: none;
            opacity: 0.8;
            animation: innerStarMove 2s ease-in-out infinite alternate;
        }

        @keyframes innerStarMove {
            0% {
                transform: translate(0, 0) scale(0.8);
                opacity: 0.3;
            }
            100% {
                transform: translate(3px, -4px) scale(1.2);
                opacity: 0.9;
            }
        }

        .go-btn:hover {
            transform: scale(1.05) translateY(-3px);
            background-color: rgba(255, 230, 0, 0.2);
        }

        /* පසුබිමේ යන මල්/තරු CSS */
        .flower {
            position: absolute;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #ffae00;
            animation: floatUp linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* Screen එක කහ පැහැයෙන් පිරී යන overlay එක */
        .yellow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffe600;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 1s ease-in-out;
        }

        /* ඊළඟට එන කළු පාට New Page එක */
        .next-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            transition: opacity 2s ease;
        }

        .next-page h1 {
            color: #ffe600;
            font-size: 1.5rem; /* ඊළඟ Page එකේ Text එකත් කුඩාවට සකස් කර ඇත */
            text-shadow: 0 0 15px #ffe600;
            font-family: 'Georgia', serif;
            text-align: center;
            margin: 0 20px;
        }
    </style>
</head>
<body>

    <div class="yellow-overlay" id="overlay"></div>

    <!-- හරියටම මැද පිහිටන Container එක -->
    <div class="container" id="mainContainer">
        <div class="Flores_Amarillas">
            💛 Happy birthday Thenara 💛
        </div>
        
        <!-- කුඩා Floating Button එක -->
        <button class="go-btn" id="goButton" onclick="startTransition()">
            <span class="btn-star" style="top: 2px; left: 4px; animation-delay: 0s;">✦</span>
            <span class="btn-star" style="bottom: 2px; left: 8px; animation-delay: 0.5s;">◆</span>
            <span class="btn-star" style="top: 3px; right: 5px; animation-delay: 1s;">✦</span>
            <span class="btn-star" style="bottom: 2px; right: 8px; animation-delay: 1.5s;">★</span>
            go
        </button>
    </div>

    <!-- ඊළඟ Page එක -->
    <div class="next-page" id="nextPage">
        <h1>✨ May all your dreams come true! ✨</h1>
    </div>

    <script>
        let spawnInterval = setInterval(createFlower, 150);

        function createFlower(isExplosion = false) {
            const flower = document.createElement('div');
            flower.classList.add('flower');

            const sizeNum = isExplosion ? Math.random() * 20 + 8 : Math.random() * 6 + 3;
            flower.style.width = sizeNum + 'px';
            flower.style.height = sizeNum + 'px';
            flower.style.left = Math.random() * 100 + 'vw';

            const duration = isExplosion ? (Math.random() * 1.5 + 1) : (Math.random() * 3 + 3);
            flower.style.animationDuration = duration + 's';

            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }

        function startTransition() {
            clearInterval(spawnInterval);
            let explosionInterval = setInterval(() => {
                createFlower(true);
            }, 20);

            document.getElementById('mainContainer').style.opacity = '0';

            setTimeout(() => {
                document.getElementById('overlay').style.opacity = '1';
            }, 800);

            setTimeout(() => {
                clearInterval(explosionInterval);
                document.getElementById('nextPage').style.opacity = '1';
                document.getElementById('nextPage').style.pointerEvents = 'auto';
            }, 2000);
        }
    </script>

</body>
</html>
