<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misti - AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f4f1ea; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    .chat-card { width: 100%; max-width: 400px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 90vh; }
    .header { background: #3c2a21; color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; word-wrap: break-word; font-size: 0.95rem; line-height: 1.4; }
    .user { background: #d3e3fd; align-self: flex-end; color: #000; border-bottom-right-radius: 2px; }
    .bot { background: #f0f0f0; align-self: flex-start; color: #333; border-bottom-left-radius: 2px; }
    .input-area { display: flex; padding: 10px; background: #fff; border-top: 1px solid #eee; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 0.95rem; }
    button { background: #3c2a21; color: white; border: none; padding: 10px 16px; margin-left: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="chat-card">
  <div class="header">Chat with Misti ✨</div>
  <div class="chat-box" id="chatBox">
    <div class="msg bot">Hello! I am Misti. How can I help you today?</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  // Google AI Studio එකෙන් ලබාගත් API Key එක
  const GEMINI_API_KEY = "AQ.Ab8RN6JJl7AiG_tRD7BwrwUbFzqL3kgkzqWHlaexbbzPuQqiKQ"; 

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const text = input.value.trim();
    if (!text) return;

    // User Message එක Screen එකට එක් කිරීම
    chatBox.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // Loading status
    const loadingDiv = document.createElement("div");
    loadingDiv.className = "msg bot";
    loadingDiv.innerText = "Misti is thinking...";
    chatBox.appendChild(loadingDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      // AQ keys සඳහා නිවැරදි Endpoint සහ Header භාවිතය
      const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "X-goog-api-key": GEMINI_API_KEY
        },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: `You are Misti, a friendly AI assistant. Answer concisely: ${text}` }]
          }]
        })
      });

      const data = await response.json();
      
      if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
        loadingDiv.innerText = data.candidates[0].content.parts[0].text;
      } else if (data.error) {
        loadingDiv.innerText = "Error: " + data.error.message;
      } else {
        loadingDiv.innerText = "Sorry, Misti couldn't process that response.";
      }
    } catch (err) {
      loadingDiv.innerText = "Network Error. Please try again.";
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
