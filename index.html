<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>misti AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .message {
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 70%;
            position: relative;
        }
        .user {
            background: rgba(255, 0, 150, 0.7);
            align-self: flex-end;
        }
        .misti {
            background: rgba(0, 0, 255, 0.7);
            align-self: flex-start;
        }
        .input-container {
            display: flex;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }
        .input-container input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 20px;
            margin-right: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .input-container button {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: #ff0080;
            color: #fff;
            cursor: pointer;
        }
        .typing-indicator {
            display: none;
            font-style: italic;
            color: #ff0080;
        }
    </style>
</head>
<body>
    <div class="chat-container" id="chatContainer"></div>
    <div class="input-container">
        <input type="text" id="userInput" placeholder="Type your message...">
        <button id="sendButton">Send</button>
    </div>
    <div class="typing-indicator" id="typingIndicator">misti AI is typing...</div>

    <script>
        const apiKey = "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";
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const message = userInput.value;
            if (!message) return;
            appendMessage(message, 'user');
            userInput.value = '';
            getResponse(message);
        }

        function appendMessage(message, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender);
            messageElement.textContent = message;
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function getResponse(message) {
            typingIndicator.style.display = 'block';
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = "This is a placeholder response from misti AI."; // Replace with actual API call
                appendMessage(response, 'misti');
            }, 2000);
        }
    </script>
</body>
</html>
