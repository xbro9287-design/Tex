<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxia de Amor - Thenara</title>
    <style>
        :root {
            --letter-love: 200px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
        }

        /* හරියටම තිරයේ මැදට ගන්න Container එක */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            -webkit-transform: translate3d(-50%, -50%, 0);
            transform: translate3d(-50%, -50%, 0);
            text-align: center;
            z-index: 10;
            width: 95%;
            max-width: 500px;
            transition: opacity 1s ease;
        }

        /* විශාල කර සකස් කළ Text එක */
        .Flores_Amarillas {
            font-size: 2.2rem; /* ලොකු පැහැදිලි Font Size එක */
            font-family: 'Georgia', serif;
            color: #ffe600;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.7);
            white-space: nowrap;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Mobile-Optimized Floating "GO" Button */
        .go-btn {
            background: rgba(5, 5, 5, 0.9);
            border: 2px solid #ffe600;
            color: #ffe600;
            padding: 10px 30px;
            font-size: 1.5rem; /* බටන් එකේ අකුරුත් ලොකු කළා */
            font-family: 'Georgia', cursive, serif;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            display: inline-block;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4), inset 0 0 10px rgba(255, 230, 0, 0.3);
            
            /* Mobile GPU performance සඳහා transform භාවිතය */
            -webkit-animation: floatButtonMobile 2.5s ease-in-out infinite, pulseGlow 2s infinite ease-in-out;
            animation: floatButtonMobile 2.5s ease-in-out infinite, pulseGlow 2s infinite ease-in-out;
            will-change: transform, box-shadow;
        }

        /* ජංගම දුරකථන සඳහාම විශේෂිත Floating Animation එක */
        @-webkit-keyframes floatButtonMobile {
            0%, 100% {
                -webkit-transform: translate3d(0, 0, 0);
                transform: translate3d(0, 0, 0);
            }
            50% {
                -webkit-transform: translate3d(0, -9px, 0);
                transform: translate3d(0, -9px, 0);
            }
        }
        @keyframes floatButtonMobile {
            0%, 100% {
                -webkit-transform: translate3d(0, 0, 0);
                transform: translate3d(0, 0, 0);
            }
            50% {
                -webkit-transform: translate3d(0, -9px, 0);
                transform: translate3d(0, -9px, 0);
            }
        }

        /* Button Glow Animation */
        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 10px #ffe600, inset 0 0 6px #ffe600;
            }
            50% {
                box-shadow: 0 0 20px #ffe600, 0 0 8px #ffffff, inset 0 0 12px #ffe600;
            }
        }

        /* බටන් එක ඇතුළේ ඇනිමේට් වෙන කුඩා තරු */
        .btn-star {
            position: absolute;
            color: #ffe600;
            font-size: 10px;
            pointer-events: none;
            opacity: 0.8;
            -webkit-animation: innerStarMove 2s ease-in-out infinite alternate;
            animation: innerStarMove 2s ease-in-out infinite alternate;
        }

        @keyframes innerStarMove {
            0% {
                transform: translate3d(0, 0, 0) scale(0.8);
                opacity: 0.3;
            }
            100% {
                transform: translate3d(4px, -5px, 0) scale(1.2);
                opacity: 0.9;
            }
        }

        /* පසුබිමේ යන මල්/තරු CSS */
        .flower {
            position: absolute;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffd700, 0 0 15px #ffae00;
            -webkit-animation: floatUp linear infinite;
            animation: floatUp linear infinite;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes floatUp {
            0% {
                transform: translate3d(0, 100vh, 0) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translate3d(0, -10vh, 0) scale(1.2);
                opacity: 0;
            }
        }

        /* Screen එක කහ පැහැයෙන් පිරී යන overlay එක */
        .yellow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffe600;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 1s ease-in-out;
        }

        /* ඊළඟට එන කළු පාට New Page එක */
        .next-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            transition: opacity 2s ease;
        }

        .next-page h1 {
            color: #ffe600;
            font-size: 2.2rem; /* ඊළඟ Page එකේ Text එකත් ලොකු කළා */
            text-shadow: 0 0 15px #ffe600;
            font-family: 'Georgia', serif;
            text-align: center;
            margin: 0 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="yellow-overlay" id="overlay"></div>

    <!-- හරියටම මැද පිහිටන Container එක -->
    <div class="container" id="mainContainer">
        <div class="Flores_Amarillas">
            💛 Happy birthday Thenara 💛
        </div>
        
        <!-- Animated Floating Button -->
        <button class="go-btn" id="goButton" onclick="startTransition()">
            <span class="btn-star" style="top: 3px; left: 5px; animation-delay: 0s;">✦</span>
            <span class="btn-star" style="bottom: 3px; left: 10px; animation-delay: 0.5s;">◆</span>
            <span class="btn-star" style="top: 4px; right: 6px; animation-delay: 1s;">✦</span>
            <span class="btn-star" style="bottom: 3px; right: 10px; animation-delay: 1.5s;">★</span>
            go
        </button>
    </div>

    <!-- ඊළඟ Page එක -->
    <div class="next-page" id="nextPage">
        <h1>✨ May all your dreams come true! ✨</h1>
    </div>

    <script>
        let spawnInterval = setInterval(createFlower, 180);

        function createFlower(isExplosion = false) {
            const flower = document.createElement('div');
            flower.classList.add('flower');

            const sizeNum = isExplosion ? Math.random() * 20 + 8 : Math.random() * 6 + 4;
            flower.style.width = sizeNum + 'px';
            flower.style.height = sizeNum + 'px';
            flower.style.left = Math.random() * 100 + 'vw';

            const duration = isExplosion ? (Math.random() * 1.5 + 1) : (Math.random() * 3 + 3);
            flower.style.animationDuration = duration + 's';

            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }

        function startTransition() {
            clearInterval(spawnInterval);
            let explosionInterval = setInterval(() => {
                createFlower(true);
            }, 25);

            document.getElementById('mainContainer').style.opacity = '0';

            setTimeout(() => {
                document.getElementById('overlay').style.opacity = '1';
            }, 800);

            setTimeout(() => {
                clearInterval(explosionInterval);
                document.getElementById('nextPage').style.opacity = '1';
                document.getElementById('nextPage').style.pointerEvents = 'auto';
            }, 2000);
        }
    </script>

</body>
</html>
