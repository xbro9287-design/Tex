<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Amor</title>
    <style>
        :root {
            --letter-love: 200px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* රූපයේ තිබූ CSS කොටස */
        .Flores_Amarillas {
            position: absolute;
            width: 90%;
            font-size: 2.5rem;
            font-family: 'Georgia', serif;
            height: var(--letter-love);
            transform: translateX(-50%);
            left: 50%;
            top: 40%;
            text-align: center;
            color: #ffe600;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.7);
            z-index: 10;
        }

        /* මල්/තරු ඇනිමේෂන් සඳහා CSS */
        .flower {
            position: absolute;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #ffae00;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="Flores_Amarillas">
        Te Amo 💛
    </div>

    <script>
        // පසුබිමේ මල්/කහ පාට particles සෑදීමට JavaScript
        function createFlower() {
            const flower = document.createElement('div');
            flower.classList.add('flower');

            // සයිස් එක සහ පිහිටීම Random ලෙස වෙනස් කිරීම
            const size = Math.random() * 8 + 4 + 'px';
            flower.style.width = size;
            flower.style.height = size;
            flower.style.left = Math.random() * 100 + 'vw';

            // ඇනිමේෂන් වෙන වේගය වෙනස් කිරීම
            const duration = Math.random() * 3 + 3 + 's';
            flower.style.animationDuration = duration;

            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, parseFloat(duration) * 1000);
        }

        // තත්පරයෙන් පංගුවකට වරක් අලුත් particle එකක් හදයි
        setInterval(createFlower, 150);
    </script>

</body>
</html>
