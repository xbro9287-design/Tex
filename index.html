<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy Birthday Thenara 💛</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    position:relative;
}

/* ================= FIRST PAGE ================= */

.container{
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:20;
    width:95%;
    transition:opacity 1s ease;
}

.Flores_Amarillas{
    font-size:2.2rem;
    font-family:Georgia,serif;
    color:#ffe600;
    text-shadow:
        0 0 10px #ffe600,
        0 0 25px #ffe600,
        0 0 50px rgba(255,230,0,.7);
    margin-bottom:30px;
}

.go-btn{
    background:rgba(10,10,10,.95);
    border:2px solid #ffe600;
    color:#ffe600;
    padding:12px 35px;
    font-size:1.5rem;
    font-family:Georgia,serif;
    letter-spacing:3px;
    border-radius:12px;
    box-shadow:
        0 0 20px #ffe600,
        inset 0 0 12px #ffe600;
    animation:pulseGlow 2s infinite ease-in-out;
}

@keyframes pulseGlow{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 15px #ffe600,inset 0 0 5px #ffe600;
    }
    50%{
        transform:scale(1.05);
        box-shadow:
            0 0 35px #ffe600,
            0 0 60px rgba(255,230,0,.5),
            inset 0 0 18px #ffe600;
    }
}

.flower{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ffd700;
    box-shadow:0 0 10px #ffd700,0 0 25px #ffe600;
    animation:floatUp linear infinite;
    pointer-events:none;
}

@keyframes floatUp{
    0%{
        transform:translateY(100vh) scale(0);
        opacity:0;
    }
    50%{opacity:1;}
    100%{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
    }
}

/* ================= BABY ================= */

.baby-container{
    position:absolute;
    bottom:-280px;
    left:50%;
    transform:translateX(-50%);
    width:170px;
    height:230px;
    z-index:30;
    transition:bottom 1.4s cubic-bezier(.175,.885,.32,1.275);
    pointer-events:none;
    filter:drop-shadow(0 0 20px #ffe600);
}

.baby-container.enter{
    bottom:25px;
}

.baby-container.exit{
    bottom:-280px;
}

.talking .baby-mouth{
    animation:talkMouth .22s infinite alternate;
}

@keyframes talkMouth{
    from{transform:scaleY(.2);}
    to{transform:scaleY(1.8);}
}

.yellow-overlay{
    position:fixed;
    inset:0;
    background:#ffe600;
    opacity:0;
    pointer-events:none;
    z-index:100;
    transition:opacity 1s ease;
}

/* ================= SECOND PAGE ================= */

.next-page{
    position:fixed;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:200;
    transition:opacity 1.5s ease;
    overflow:hidden;
}

#thenaraCanvas,
#magicBlastCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.fairy-baby{
    position:absolute;
    width:120px;
    height:150px;
    z-index:210;
    display:none;
    filter:drop-shadow(0 0 25px #ffe600);
}

.wing-left{
    transform-origin:right center;
    animation:flapLeft .15s infinite alternate;
}

.wing-right{
    transform-origin:left center;
    animation:flapRight .15s infinite alternate;
}

@keyframes flapLeft{
    to{transform:rotate(-28deg) scaleX(.3);}
}

@keyframes flapRight{
    to{transform:rotate(28deg) scaleX(.3);}
}

/* ================================================= */
/* ================= THIRD PAGE ==================== */
/* ================================================= */

.third-page{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 48%,
            rgba(255,230,0,.12) 0%,
            rgba(255,190,0,.05) 18%,
            transparent 42%),
        radial-gradient(circle at 50% 100%,
            #241e00 0%,
            #080800 45%,
            #010101 100%);
    opacity:0;
    pointer-events:none;
    z-index:300;
    transition:opacity 1.8s ease;
    overflow:hidden;
}

/* moving golden atmosphere */

.third-page::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:
        repeating-conic-gradient(
            from 0deg,
            transparent 0deg,
            rgba(255,230,0,.025) 5deg,
            transparent 10deg
        );
    animation:rotateLight 35s linear infinite;
    pointer-events:none;
}

@keyframes rotateLight{
    to{transform:rotate(360deg);}
}

/* stars background */

.space-star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff9a8;
    border-radius:50%;
    box-shadow:0 0 8px #ffe600;
    animation:twinkle 1.5s infinite alternate;
    z-index:301;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.5);}
    to{opacity:1;transform:scale(1.8);}
}

/* VINE */

#vineCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:305;
}

/* glow underneath flowers */

.flower-aura{
    position:absolute;
    width:150px;
    height:150px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(255,230,0,.28),
        rgba(255,230,0,.08) 35%,
        transparent 70%
    );
    filter:blur(8px);
    opacity:0;
    z-index:306;
    pointer-events:none;
    animation:auraPulse 2s infinite alternate;
}

@keyframes auraPulse{
    from{transform:scale(.85);opacity:.45;}
    to{transform:scale(1.2);opacity:.8;}
}

/* FLOWERS */

.sunflower-container{
    position:absolute;
    inset:0;
    z-index:310;
    pointer-events:none;
}

.sunflower{
    position:absolute;
    width:110px;
    height:110px;
    pointer-events:auto;
    cursor:pointer;
    opacity:0;
    transform:translateY(180px) scale(.1) rotate(-180deg);
    filter:
        drop-shadow(0 0 8px #ffe600)
        drop-shadow(0 0 22px #ffd000)
        drop-shadow(0 0 45px rgba(255,230,0,.65));
}

/* each flower arrives separately */

#flowerLeft{
    left:10%;
    top:29%;
}

#flowerMid{
    left:35%;
    top:19%;
}

#flowerRight{
    left:69%;
    top:32%;
}

.sunflower.bloom{
    opacity:1;
    animation:
        flowerEntrance 1.5s cubic-bezier(.17,.89,.32,1.28) forwards,
        flowerFloat 3.5s 1.5s ease-in-out infinite alternate;
}

@keyframes flowerEntrance{
    0%{
        opacity:0;
        transform:translateY(220px) scale(.05) rotate(-180deg);
    }
    60%{
        opacity:1;
        transform:translateY(-18px) scale(1.08) rotate(12deg);
    }
    100%{
        opacity:1;
        transform:translateY(0) scale(1) rotate(0deg);
    }
}

@keyframes flowerFloat{
    from{transform:translateY(0) rotate(-2deg) scale(1);}
    to{transform:translateY(-12px) rotate(2deg) scale(1.04);}
}

/* slight tilt */

#flowerLeft.bloom{
    animation:
        flowerEntranceLeft 1.5s cubic-bezier(.17,.89,.32,1.28) forwards,
        floatLeft 3s 1.5s ease-in-out infinite alternate;
}

#flowerMid.bloom{
    animation:
        flowerEntranceMid 1.7s cubic-bezier(.17,.89,.32,1.28) forwards,
        floatMid 3.3s 1.7s ease-in-out infinite alternate;
}

#flowerRight.bloom{
    animation:
        flowerEntranceRight 1.9s cubic-bezier(.17,.89,.32,1.28) forwards,
        floatRight 3.5s 1.9s ease-in-out infinite alternate;
}

@keyframes flowerEntranceLeft{
    from{
        opacity:0;
        transform:translate(-80px,220px) scale(.05) rotate(-180deg);
    }
    65%{
        opacity:1;
        transform:translate(10px,-15px) scale(1.1) rotate(-15deg);
    }
    to{
        opacity:1;
        transform:translate(0,0) scale(1) rotate(-8deg);
    }
}

@keyframes flowerEntranceMid{
    from{
        opacity:0;
        transform:translate(-10px,230px) scale(.05) rotate(-180deg);
    }
    65%{
        opacity:1;
        transform:translate(-15px,-20px) scale(1.1) rotate(-8deg);
    }
    to{
        opacity:1;
        transform:translate(-10px,0) scale(1) rotate(-7deg);
    }
}

@keyframes flowerEntranceRight{
    from{
        opacity:0;
        transform:translate(90px,230px) scale(.05) rotate(180deg);
    }
    65%{
        opacity:1;
        transform:translate(-10px,-15px) scale(1.1) rotate(15deg);
    }
    to{
        opacity:1;
        transform:translate(0,0) scale(1) rotate(8deg);
    }
}

@keyframes floatLeft{
    from{transform:translateY(0) rotate(-8deg);}
    to{transform:translateY(-12px) rotate(-12deg);}
}

@keyframes floatMid{
    from{transform:translate(-10px,0) rotate(-7deg);}
    to{transform:translate(-10px,-10px) rotate(-11deg);}
}

@keyframes floatRight{
    from{transform:translateY(0) rotate(8deg);}
    to{transform:translateY(-13px) rotate(12deg);}
}

/* flower center */

.flower-center{
    animation:centerGlow 1.2s infinite alternate;
}

@keyframes centerGlow{
    from{
        filter:brightness(1);
    }
    to{
        filter:brightness(1.5);
    }
}

/* STAR DUST */

.star-dust{
    position:absolute;
    color:#ffe600;
    font-size:14px;
    pointer-events:none;
    z-index:308;
    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffe600,
        0 0 25px #ffd000;
    animation:starFall 2.2s linear forwards;
}

@keyframes starFall{
    0%{
        opacity:0;
        transform:translate(0,0) scale(.2) rotate(0deg);
    }
    15%{opacity:1;}
    100%{
        opacity:0;
        transform:
            translate(
                calc((var(--random-x) - .5) * 100px),
                220px
            )
            scale(.1)
            rotate(500deg);
    }
}

/* glowing particles */

.magic-particle{
    position:absolute;
    border-radius:50%;
    background:#ffe600;
    box-shadow:
        0 0 5px #fff,
        0 0 12px #ffe600,
        0 0 25px #ffd000;
    pointer-events:none;
    z-index:307;
    animation:particleMove 2s linear forwards;
}

@keyframes particleMove{
    0%{
        opacity:0;
        transform:translateY(0) scale(.2);
    }
    20%{opacity:1;}
    100%{
        opacity:0;
        transform:translate(
            calc((var(--dx) - .5) * 160px),
            250px
        ) scale(.05);
    }
}

/* ================= CHAT ================= */

.chat-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(5px);
    z-index:390;
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
}

.chat-backdrop.active{
    opacity:1;
    pointer-events:auto;
}

.chat-modal{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(.55);
    width:88%;
    max-width:400px;
    background:
        linear-gradient(
            145deg,
            rgba(25,25,25,.98),
            rgba(5,5,5,.98)
        );
    border:2px solid #ffe600;
    border-radius:22px;
    padding:22px;
    z-index:400;
    opacity:0;
    pointer-events:none;
    box-shadow:
        0 0 15px #ffe600,
        0 0 45px rgba(255,230,0,.45),
        inset 0 0 20px rgba(255,230,0,.12);
    transition:
        opacity .45s ease,
        transform .45s cubic-bezier(.175,.885,.32,1.275);
}

.chat-modal.active{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,-50%) scale(1);
}

.chat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,230,0,.35);
    padding-bottom:12px;
    margin-bottom:16px;
}

.chat-title{
    color:#ffe600;
    font-size:1.2rem;
    font-weight:bold;
    font-family:Georgia,serif;
    text-shadow:
        0 0 8px #ffe600,
        0 0 18px #ffe600;
}

.close-chat{
    color:#ffe600;
    font-size:1.5rem;
    cursor:pointer;
    text-shadow:0 0 10px #ffe600;
}

.chat-body{
    color:white;
    font-size:1rem;
    line-height:1.7;
    background:rgba(30,30,30,.8);
    padding:17px;
    border-radius:14px;
    border-left:4px solid #ffe600;
    box-shadow:inset 0 0 15px rgba(255,230,0,.08);
}

/* little heart */

.chat-heart{
    text-align:center;
    color:#ffe600;
    font-size:28px;
    margin-bottom:8px;
    animation:heartBeat 1s infinite;
}

@keyframes heartBeat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.25);}
}

/* mobile */

@media(max-width:500px){

    .Flores_Amarillas{
        font-size:1.75rem;
    }

    .sunflower{
        width:88px;
        height:88px;
    }

    #flowerLeft{
        left:4%;
        top:31%;
    }

    #flowerMid{
        left:32%;
        top:21%;
    }

    #flowerRight{
        left:65%;
        top:34%;
    }

    .chat-modal{
        width:90%;
    }
}
</style>
</head>

<script>

/* ================================================= */
/* FIRST PAGE FLOWERS */
/* ================================================= */

let spawnInterval=setInterval(createFlower,180);

function createFlower(){

    const flower=document.createElement("div");

    flower.className="flower";

    flower.style.left=Math.random()*100+"vw";

    flower.style.animationDuration=
        (Math.random()*3+3)+"s";

    document.body.appendChild(flower);

    setTimeout(()=>{
        flower.remove();
    },5000);
}


/* ================================================= */
/* BABY */
/* ================================================= */

let hasTriggered=false;

function triggerBabyAnimation(){

    if(hasTriggered)return;

    hasTriggered=true;

    const baby=document.getElementById("babyCharacter");
    const voice=document.getElementById("babyVoice");

    setTimeout(()=>{

        baby.classList.add("enter");

        setTimeout(()=>{

            voice.play()
            .then(()=>{
                baby.classList.add("talking");
            })
            .catch(()=>{});

        },1200);

    },2000);

    voice.addEventListener("ended",()=>{

        baby.classList.remove("talking","enter");
        baby.classList.add("exit");

    });

}

window.addEventListener("DOMContentLoaded",()=>{
    triggerBabyAnimation();
});

/* ================================================= */
/* SECOND PAGE */
/* ================================================= */

let fairyX=-150;
let fairyY=window.innerHeight*.3;

function initSecondPage(){

    const canvas=document.getElementById("thenaraCanvas");
    const ctx=canvas.getContext("2d");

    canvas.width=innerWidth;
    canvas.height=innerHeight;

    const fairy=document.getElementById("fairyBaby");

    fairy.style.display="block";

    const particles=[];

    for(let i=0;i<55;i++){

        particles.push({

            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height,

            vx:(Math.random()-.5)*.8,
            vy:(Math.random()-.5)*.8,

            size:Math.random()*5+10

        });

    }

    let startTime=null;

    function flyStep(timestamp){

        if(!startTime)
            startTime=timestamp;

        let progress=(timestamp-startTime)/1000;

        if(progress<1.5){

            fairyX=
                -150+
                (canvas.width*.5+150)*
                (progress/1.5);

            fairyY=
                canvas.height*.3+
                Math.sin(progress*8)*40;

        }

        else if(progress<4){

            fairyX=
                canvas.width/2+
                Math.sin(progress*5)*
                canvas.width*.35;

            fairyY=
                canvas.height/2+
                Math.cos(progress*6)*
                canvas.height*.25;

        }

        else if(progress<5){

            fairyX+=(canvas.width/2-60-fairyX)*.1;
            fairyY+=(canvas.height/2-75-fairyY)*.1;

        }

        else{

            triggerMagicBallsBlast(
                canvas.width/2,
                canvas.height/2
            );

            return;
        }

        fairy.style.left=fairyX+"px";
        fairy.style.top=fairyY+"px";

        ctx.clearRect(
            0,0,
            canvas.width,
            canvas.height
        );

        particles.forEach(p=>{

            p.x+=p.vx;
            p.y+=p.vy;

            ctx.save();

            ctx.font=
                `600 ${p.size}px Georgia`;

            ctx.fillStyle="#ffe600";

            ctx.shadowColor="#ffe600";
            ctx.shadowBlur=12;

            ctx.fillText(
                "THENARA",
                p.x,
                p.y
            );

            ctx.restore();

        });

        requestAnimationFrame(flyStep);
    }

    requestAnimationFrame(flyStep);
}


/* ================================================= */
/* MAGIC BLAST */
/* ================================================= */

function triggerMagicBallsBlast(centerX,centerY){

    const canvas=document.getElementById(
        "magicBlastCanvas"
    );

    const ctx=canvas.getContext("2d");

    canvas.width=innerWidth;
    canvas.height=innerHeight;

    const balls=[];

    for(let i=0;i<45;i++){

        balls.push({

            x:centerX,
            y:centerY,

            vx:(Math.random()-.5)*25,
            vy:(Math.random()-.5)*25,

            radius:Math.random()*10+5,
            growth:Math.random()*2+2

        });

    }

    function animateBlast(){

        ctx.clearRect(
            0,0,
            canvas.width,
            canvas.height
        );

        let allBig=true;

        balls.forEach(ball=>{

            ball.x+=ball.vx;
            ball.y+=ball.vy;

            ball.radius+=ball.growth;

            ctx.beginPath();

            ctx.arc(
                ball.x,
                ball.y,
                ball.radius,
                0,
                Math.PI*2
            );

            ctx.fillStyle="#ffe600";

            ctx.shadowColor="#ffe600";
            ctx.shadowBlur=25;

            ctx.fill();

            if(
                ball.radius<
                Math.max(
                    canvas.width,
                    canvas.height
                )
            ){
                allBig=false;
            }

        });

        if(!allBig){

            requestAnimationFrame(
                animateBlast
            );

        }else{

            document.getElementById(
                "nextPage"
            ).style.opacity="0";

            const third=
                document.getElementById(
                    "thirdPage"
                );

            third.style.opacity="1";
            third.style.pointerEvents="auto";

            setTimeout(
                initThirdPage,
                600
            );

        }

    }

    animateBlast();
}

/* ================================================= */
/* VINES */
/* ================================================= */

function initVines(){

    const canvas=
        document.getElementById(
            "vineCanvas"
        );

    const ctx=canvas.getContext("2d");

    canvas.width=innerWidth;
    canvas.height=innerHeight;

    let progress=0;

    function draw(){

        ctx.clearRect(
            0,0,
            canvas.width,
            canvas.height
        );

        progress+=.012;

        if(progress>1)
            progress=1;

        ctx.lineWidth=5;

        ctx.lineCap="round";

        ctx.strokeStyle="#ffe600";

        ctx.shadowColor="#ffe600";
        ctx.shadowBlur=18;

        /* LEFT VINE */

        drawPartialCurve(
            ctx,
            .45,
            1,
            .10,
            .70,
            .20,
            .38,
            progress
        );

        /* MIDDLE VINE */

        drawPartialCurve(
            ctx,
            .50,
            1,
            .38,
            .60,
            .43,
            .28,
            progress
        );

        /* RIGHT VINE */

        drawPartialCurve(
            ctx,
            .55,
            1,
            .90,
            .70,
            .75,
            .41,
            progress
        );

        /* tiny glowing leaves */

        if(progress>.35){

            drawLeaf(
                ctx,
                canvas.width*.29,
                canvas.height*.70,
                -35
            );

            drawLeaf(
                ctx,
                canvas.width*.68,
                canvas.height*.70,
                35
            );

        }

        if(progress<1){

            requestAnimationFrame(draw);

        }else{

            bloomFlowers();

        }

    }

    draw();

}


/* ================================================= */
/* PARTIAL VINE */
/* ================================================= */

function drawPartialCurve(
    ctx,
    sx,sy,
    cx,cy,
    ex,ey,
    progress
){

    const w=innerWidth;
    const h=innerHeight;

    ctx.beginPath();

    ctx.moveTo(
        w*sx,
        h*sy
    );

    const endX=
        w*sx+
        (w*ex-w*sx)*progress;

    const endY=
        h*sy+
        (h*ey-h*sy)*progress;

    ctx.quadraticCurveTo(
        w*cx,
        h*cy,
        endX,
        endY
    );

    ctx.stroke();

}


/* ================================================= */
/* LEAVES */
/* ================================================= */

function drawLeaf(ctx,x,y,angle){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
        angle*Math.PI/180
    );

    ctx.fillStyle="#ffe600";

    ctx.shadowColor="#ffe600";
    ctx.shadowBlur=12;

    ctx.beginPath();

    ctx.ellipse(
        0,0,
        22,8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* ================================================= */
/* FLOWER BLOOM */
/* ================================================= */

function bloomFlowers(){

    const left=
        document.getElementById(
            "flowerLeft"
        );

    const mid=
        document.getElementById(
            "flowerMid"
        );

    const right=
        document.getElementById(
            "flowerRight"
        );

    /* one by one */

    setTimeout(()=>{
        left.classList.add("bloom");
        startFlowerParticles(left,0);
    },300);

    setTimeout(()=>{
        mid.classList.add("bloom");
        startFlowerParticles(mid,1);
    },1100);

    setTimeout(()=>{
        right.classList.add("bloom");
        startFlowerParticles(right,2);
    },1900);

}


/* ================================================= */
/* PARTICLES FROM FLOWERS */
/* ================================================= */

function startFlowerParticles(flower,index){

    const interval=setInterval(()=>{

        if(
            !flower.classList.contains(
                "bloom"
            )
        ) return;

        const rect=
            flower.getBoundingClientRect();

        const x=
            rect.left+
            rect.width/2;

        const y=
            rect.top+
            rect.height/2;

        /* STAR */

        const star=
            document.createElement("div");

        star.className="star-dust";

        star.innerText=
            Math.random()>.5
            ? "✦"
            : "★";

        star.style.left=x+"px";
        star.style.top=y+"px";

        star.style.setProperty(
            "--random-x",
            Math.random()
        );

        document
        .getElementById("thirdPage")
        .appendChild(star);

        setTimeout(()=>{
            star.remove();
        },2300);

        /* extra glowing dot */

        if(Math.random()>.3){

            const p=
                document.createElement("div");

            p.className="magic-particle";

            const size=
                Math.random()*5+3;

            p.style.width=size+"px";
            p.style.height=size+"px";

            p.style.left=
                x+
                (Math.random()-.5)*35+
                "px";

            p.style.top=
                y+
                30+
                "px";

            p.style.setProperty(
                "--dx",
                Math.random()
            );

            document
            .getElementById("thirdPage")
            .appendChild(p);

            setTimeout(()=>{
                p.remove();
            },2100);

        }

    },130);

}
